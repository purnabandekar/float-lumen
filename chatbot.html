<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloatChat AI Chatbot</title>

<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background-image:url("images/ocean-bg.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.chat-container {
    width: 650px;
    max-width: 95%;
    height: 500px;
    max-height: 90vh;
    background: #0b1c33;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-header {
    background: linear-gradient(90deg,#1fa2ff,#12d8fa,#1fa2ff);
    padding: 18px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    color: white;
    letter-spacing: 1px;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.bot-msg, .user-msg {
    color: white;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 12px;
    width: fit-content;
    max-width: 80%;
    overflow-wrap: anywhere;
    animation: fadeIn 0.25s ease;
    line-height: 1.5;
}

.bot-msg {
    background: #1e3357;
}

.user-msg {
    background: #0ea5e9;
    margin-left: auto;
}

.chat-input {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #081426;
}

.chat-input input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 15px;
}

.chat-input button {
    padding: 12px 20px;
    background: #1fa2ff;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.chat-input button:hover {
    background: #0ea5e9;
}

.quick-questions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 0 15px 12px;
    background: #081426;
}

.quick-questions button {
    padding: 7px 10px;
    border: 1px solid #1fa2ff;
    border-radius: 15px;
    background: #102844;
    color: #dff6ff;
    cursor: pointer;
    font-size: 12px;
}

.quick-questions button:hover {
    background: #1e4770;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 500px) {
    .chat-container {
        height: 90vh;
    }

    .chat-header {
        font-size: 18px;
    }

    .chat-input button {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        🤖 FloatChat AI Assistant
    </div>

    <div class="messages" id="chat" aria-live="polite">
        <div class="bot-msg">
            Hello! 🌊 I am FloatChat, your ocean-data assistant.
            You can ask me about temperature, salinity, oxygen,
            ARGO floats, ocean depth, and ocean data analysis.
        </div>
    </div>

    <div class="quick-questions">
        <button onclick="askQuestion('What is ocean temperature?')">
            🌡 Temperature
        </button>
        <button onclick="askQuestion('Explain salinity')">
            🌊 Salinity
        </button>
        <button onclick="askQuestion('What are ARGO floats?')">
            📡 ARGO Floats
        </button>
        <button onclick="askQuestion('Explain oxygen levels')">
            🫧 Oxygen
        </button>
    </div>

    <div class="chat-input">
        <input
            type="text"
            id="msg"
            placeholder="Ask about ocean data..."
            autocomplete="off"
            aria-label="Enter your question"
        >
        <button onclick="send()">Send</button>
    </div>

</div>

<script>


const oceanData = {
    temperature: 28.8,
    salinity: 33.5,
    activeFloats: 84,
    oxygen: 210,
    oxygenUnit: "µmol/kg",
    location: "near Mumbai"
};

// Store conversation history during the current page session.
const conversationHistory = [];


/* ---------------------------------
   1. TEXT PREPROCESSING
---------------------------------- */

function preprocessText(text) {
    return text
        .toLowerCase()
        .normalize("NFKC")
        .replace(/[^\p{L}\p{N}\s.-]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* ---------------------------------
   2. TOKENIZATION
---------------------------------- */

function tokenize(text) {
    return preprocessText(text)
        .split(/\s+/)
        .filter(Boolean);
}


/* ---------------------------------
   3. INTENT RECOGNITION
---------------------------------- */

function detectIntent(text) {
    const message = preprocessText(text);
    const tokens = tokenize(text);

    const has = (...words) =>
        words.some(word => message.includes(word));

    // Greetings
    if (
        /^(hi|hello|hey|good morning|good afternoon|good evening)\b/.test(message)
    ) {
        return "greeting";
    }

    // Help
    if (
        has("what can you do", "help me", "help", "your features")
    ) {
        return "help";
    }

    // Identity
    if (
        has("who are you", "your name", "what are you")
    ) {
        return "identity";
    }

    // Temperature
    if (
        has("temperature", "warm", "cold", "heat", "thermal")
    ) {
        return "temperature";
    }

    // Salinity
    if (
        has("salinity", "saline", "salt", "saltiness", "psu")
    ) {
        return "salinity";
    }

    // ARGO floats
    if (
        has("argo", "float", "floats", "profiling float")
    ) {
        return "floats";
    }

    // Oxygen and oxygen minimum zones
    if (
        has("oxygen", "omz", "hypoxia", "deoxygenation", "low oxygen")
    ) {
        return "oxygen";
    }

    // Depth
    if (
        has("depth", "deep", "deepest", "shallow", "meters", "metres")
    ) {
        return "depth";
    }

    // Data analysis
    if (
        has("average", "mean", "maximum", "minimum", "highest",
            "lowest", "analyze", "analysis", "trend", "compare",
            "statistics")
    ) {
        return "analysis";
    }

    // Location
    if (
        has("location", "where", "indian ocean", "arabian sea", "mumbai")
    ) {
        return "location";
    }

    // Thanks
    if (
        has("thank you", "thanks", "thankyou")
    ) {
        return "thanks";
    }

    // Farewell
    if (
        /^(bye|goodbye|see you|see you later)\b/.test(message)
    ) {
        return "farewell";
    }

    // Unknown intent
    return "unknown";
}


/* ---------------------------------
   4. ENTITY EXTRACTION
---------------------------------- */

function extractEntities(text) {
    const message = preprocessText(text);
    const entities = {};

    // Extract depth values such as 500 m or 1000 meters.
    const depthMatch = message.match(
        /(\d+(?:\.\d+)?)\s*(m|meter|meters|metre|metres)\b/
    );

    if (depthMatch) {
        entities.depth = Number(depthMatch[1]);
    }

    // Also accept phrases such as "at depth 500".
    const depthPhrase = message.match(
        /(?:depth|at)\s+(\d+(?:\.\d+)?)\b/
    );

    if (
        depthPhrase &&
        entities.depth === undefined
    ) {
        entities.depth = Number(depthPhrase[1]);
    }

    // Extract a temperature number if the user mentions degrees.
    const temperatureMatch = message.match(
        /(-?\d+(?:\.\d+)?)\s*(?:°c|celsius|degrees)/
    );

    if (temperatureMatch) {
        entities.temperature = Number(temperatureMatch[1]);
    }

    return entities;
}


/* ---------------------------------
   5. RESPONSE GENERATION
---------------------------------- */

function generateResponse(text, intentOverride = null) {
    const intent = intentOverride || detectIntent(text);
    const entities = extractEntities(text);

    let reply = "";

    switch (intent) {
        case "greeting":
            reply =
                "Hello! 👋 Welcome to FloatChat. " +
                "Ask me about ocean temperature, salinity, oxygen, " +
                "ARGO floats, depth, or ocean-data analysis.";
            break;

        case "help":
            reply =
                "I can help with these topics:\n\n" +
                "🌡 Ocean temperature\n" +
                "🌊 Salinity\n" +
                "📡 ARGO profiling floats\n" +
                "🫧 Oxygen levels and Oxygen Minimum Zones\n" +
                "📏 Ocean depth\n" +
                "📊 Basic analysis of the sample dataset\n\n" +
                "Try asking: 'What is the oxygen level at 500 meters?'";
            break;

        case "identity":
            reply =
                "I am FloatChat, a browser-based assistant designed " +
                "to answer questions about ocean observations and " +
                "ARGO float data using a lightweight NLP module.";
            break;

        case "temperature":
            reply =
                "🌡 Ocean Temperature\n\n" +
                "The demonstration temperature is " +
                oceanData.temperature + "°C " +
                oceanData.location + ".\n\n" +
                "Ocean temperature varies with location, season, " +
                "currents, and depth. This is a sample value, " +
                "not a live measurement.";
            break;

        case "salinity":
            reply =
                "🌊 Ocean Salinity\n\n" +
                "The demonstration salinity is " +
                oceanData.salinity + " PSU.\n\n" +
                "Salinity describes the concentration of dissolved " +
                "salts in seawater. It varies with evaporation, " +
                "rainfall, river input, ice formation, and currents.\n\n" +
                "This is a sample value, not a live measurement.";
            break;

        case "floats":
            reply =
                "📡 ARGO Floats\n\n" +
                "ARGO floats are autonomous instruments that collect " +
                "ocean measurements such as temperature and salinity " +
                "at different depths and transmit observations by satellite.\n\n" +
                "The demonstration count in this chatbot is " +
                oceanData.activeFloats + " active floats. It is a " +
                "placeholder, not a verified live count.";
            break;

        case "oxygen":
            reply =
                "🫧 Ocean Oxygen\n\n" +
                "The demonstration oxygen value is " +
                oceanData.oxygen + " " + oceanData.oxygenUnit + ".\n\n" +
                "Dissolved oxygen is important for marine life. " +
                "An Oxygen Minimum Zone (OMZ) is a region in the ocean " +
                "where oxygen concentrations are relatively low.\n\n" +
                "The value shown here is sample data and should not " +
                "be treated as a real-time ocean observation.";
            break;

        case "depth":
            if (entities.depth !== undefined) {
                reply = getDepthResponse(entities.depth);
            } else {
                reply =
                    "📏 Ocean Depth\n\n" +
                    "Ocean conditions change with depth. Temperature, " +
                    "salinity, pressure, and oxygen can vary through " +
                    "the water column.\n\n" +
                    "You can ask a specific question such as " +
                    "'What is the oxygen level at 500 meters?'";
            }
            break;

        case "analysis":
            reply = getDataAnalysisResponse(text);
            break;

        case "location":
            reply =
                "🌍 Ocean Location\n\n" +
                "This chatbot uses sample information referring to " +
                oceanData.location + ". It does not currently read " +
                "your location or fetch live measurements.\n\n" +
                "The Arabian Sea is part of the northern Indian Ocean " +
                "and is an important region for oceanographic research.";
            break;

        case "thanks":
            reply =
                "You're welcome! 😊 Feel free to ask another " +
                "question about ocean data.";
            break;

        case "farewell":
            reply =
                "Goodbye! 🌊 Thank you for exploring ocean data with FloatChat.";
            break;

        default:
            reply =
                "I'm not sure I understood that question.\n\n" +
                "Try asking about:\n" +
                "• Ocean temperature\n" +
                "• Salinity\n" +
                "• ARGO floats\n" +
                "• Oxygen or OMZ\n" +
                "• Ocean depth\n" +
                "• Average, maximum, or minimum values";
    }

    return {
        intent: intent,
        entities: entities,
        reply: reply
    };
}


/* ---------------------------------
   6. DEPTH-BASED SAMPLE LOOKUP
---------------------------------- */

function getDepthResponse(requestedDepth) {
    const depths = [0, 200, 500, 1000, 1500, 2000, 2500, 3000];
    const oxygenValues = [260, 210, 170, 140, 110, 85, 70, 60];

    let nearestIndex = 0;

    for (let i = 1; i < depths.length; i++) {
        if (
            Math.abs(depths[i] - requestedDepth) <
            Math.abs(depths[nearestIndex] - requestedDepth)
        ) {
            nearestIndex = i;
        }
    }

    if (requestedDepth < 0 || requestedDepth > 3000) {
        return "The sample dataset covers depths from 0 to 3000 meters. " +
            "Please enter a depth within that range.";
    }

    const nearestDepth = depths[nearestIndex];
    const oxygen = oxygenValues[nearestIndex];

    return (
        "📏 Depth-Based Oxygen Information\n\n" +
        "You asked about " + requestedDepth + " meters.\n" +
        "The nearest available sample depth is " + nearestDepth + " m.\n" +
        "Sample oxygen value: " + oxygen + " µmol/kg.\n\n" +
        "This uses the nearest recorded sample depth, not interpolation " +
        "or a live sensor reading."
    );
}


/* ---------------------------------
   7. BASIC DATA ANALYSIS
---------------------------------- */

function getDataAnalysisResponse(text) {
    const oxygenValues = [260, 210, 170, 140, 110, 85, 70, 60];

    const average = oxygenValues.reduce(
        (sum, value) => sum + value, 0
    ) / oxygenValues.length;

    const maximum = Math.max(...oxygenValues);
    const minimum = Math.min(...oxygenValues);

    const message = preprocessText(text);

    if (message.includes("average") || message.includes("mean")) {
        return "📊 Average Oxygen\n\n" +
            "The average oxygen value in the sample dataset is " +
            average.toFixed(2) + " µmol/kg.";
    }

    if (message.includes("maximum") || message.includes("highest")) {
        return "📈 Maximum Oxygen\n\n" +
            "The maximum oxygen value in the sample dataset is " +
            maximum + " µmol/kg.";
    }

    if (message.includes("minimum") || message.includes("lowest")) {
        return "📉 Minimum Oxygen\n\n" +
            "The minimum oxygen value in the sample dataset is " +
            minimum + " µmol/kg.";
    }

    return "📊 Sample Data Analysis\n\n" +
        "Number of oxygen measurements: " + oxygenValues.length + "\n" +
        "Average: " + average.toFixed(2) + " µmol/kg\n" +
        "Maximum: " + maximum + " µmol/kg\n" +
        "Minimum: " + minimum + " µmol/kg\n\n" +
        "These statistics are calculated from the demonstration values.";
}


/* ---------------------------------
   8. CHAT UI
---------------------------------- */

function addMessage(text, className) {
    const chat = document.getElementById("chat");
    const messageElement = document.createElement("div");

    messageElement.className = className;

    // textContent prevents user input from being interpreted as HTML.
    messageElement.textContent = text;

    chat.appendChild(messageElement);
    chat.scrollTop = chat.scrollHeight;
}

/* ---------------------------------
   8. OPTIONAL IN-BROWSER AI NLP
   Loads a pretrained zero-shot model on first use. No API key is needed.
   If the model cannot load (offline/network restrictions), the existing
   lightweight NLP intent detector continues to work automatically.
---------------------------------- */

let aiIntentClassifier = null;
let aiModelLoadPromise = null;
let aiModelUnavailable = false;

const AI_INTENT_LABELS = [
    "greeting or casual conversation",
    "asking for help or chatbot capabilities",
    "asking who the assistant is",
    "asking about ocean temperature or heat",
    "asking about ocean salinity or salt in seawater",
    "asking about ARGO ocean profiling floats",
    "asking about dissolved oxygen or oxygen minimum zones",
    "asking about ocean depth or conditions at a depth",
    "asking for statistics, averages, maximums, minimums, or trends in ocean data",
    "asking about an ocean location or the Arabian Sea",
    "expressing thanks",
    "saying goodbye"
];

const AI_LABEL_TO_INTENT = {
    "greeting or casual conversation": "greeting",
    "asking for help or chatbot capabilities": "help",
    "asking who the assistant is": "identity",
    "asking about ocean temperature or heat": "temperature",
    "asking about ocean salinity or salt in seawater": "salinity",
    "asking about ARGO ocean profiling floats": "floats",
    "asking about dissolved oxygen or oxygen minimum zones": "oxygen",
    "asking about ocean depth or conditions at a depth": "depth",
    "asking for statistics, averages, maximums, minimums, or trends in ocean data": "analysis",
    "asking about an ocean location or the Arabian Sea": "location",
    "expressing thanks": "thanks",
    "saying goodbye": "farewell"
};

async function getAIIntent(text) {
    if (aiModelUnavailable) return null;

    try {
        if (!aiIntentClassifier) {
            if (!aiModelLoadPromise) {
                aiModelLoadPromise = import(
                    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2"
                ).then(async (transformers) => {
                    const pipeline = transformers.pipeline;
                    return await pipeline(
                        "zero-shot-classification",
                        "Xenova/mobilebert-uncased-mnli"
                    );
                });
            }
            aiIntentClassifier = await aiModelLoadPromise;
        }

        const prediction = await aiIntentClassifier(text, AI_INTENT_LABELS, {
            multi_label: false
        });

        const label = prediction?.labels?.[0];
        const confidence = prediction?.scores?.[0] ?? 0;
        console.log("AI NLP prediction:", label, "confidence:", confidence.toFixed(3));

        // Only trust the model when its confidence is reasonable.
        if (label && confidence >= 0.40) {
            return AI_LABEL_TO_INTENT[label] || null;
        }
        return null;
    } catch (error) {
        console.warn("AI model unavailable; using local NLP rules instead.", error);
        aiModelUnavailable = true;
        return null;
    }
}

/* ---------------------------------
   9. CHAT UI
---------------------------------- */

function addMessage(text, className) {
    const chat = document.getElementById("chat");
    const messageElement = document.createElement("div");

    messageElement.className = className;
    // textContent prevents user input from being interpreted as HTML.
    messageElement.textContent = text;

    chat.appendChild(messageElement);
    chat.scrollTop = chat.scrollHeight;
    return messageElement;
}

async function send() {
    const input = document.getElementById("msg");
    const userText = input.value.trim();

    if (!userText) return;

    addMessage(userText, "user-msg");
    input.value = "";

    const loadingMessage = addMessage("Understanding your question…", "bot-msg");
    const localIntent = detectIntent(userText);
    const aiIntent = await getAIIntent(userText);

    // Keep clear keyword matches from the existing NLP, and use the AI model
    // to interpret paraphrases or questions that the keyword rules miss.
    const intentOverride = (localIntent === "unknown" && aiIntent)
        ? aiIntent
        : localIntent;
    const result = generateResponse(userText, intentOverride);

    loadingMessage.textContent = result.reply;

    conversationHistory.push({
        user: userText,
        intent: result.intent,
        entities: result.entities,
        assistant: result.reply
    });

    console.log("NLP intent:", result.intent);
    console.log("AI intent:", aiIntent || "not used / unavailable");
    console.log("Extracted entities:", result.entities);
}

function askQuestion(question) {
    document.getElementById("msg").value = question;
    send();
}

// Press Enter to send a message.
document.getElementById("msg").addEventListener("keydown", function(event) {
    if (event.key === "Enter") send();
});

function askQuestion(question) {
    document.getElementById("msg").value = question;
    send();
}

// Press Enter to send a message.
document.getElementById("msg").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        send();
    }
});
</script>

</body>
</html>
