<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Ocean Oxygen Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#020617;
color:white;
}

/* HEADER */

header{
padding:18px;
text-align:center;
font-size:26px;
background:linear-gradient(90deg,#021b3a,#003a6b);
box-shadow:0 0 20px rgba(0,200,255,0.4);
}

/* GRID */

.container{
display:grid;
grid-template-columns:300px 1fr;
gap:20px;
padding:30px;
}

/* CARDS */

.card{
background:#0f172a;
padding:25px;
border-radius:15px;

box-shadow:
0 0 10px rgba(56,189,248,0.3),
0 0 30px rgba(56,189,248,0.1);

transition:0.3s;
}

.card:hover{
transform:translateY(-4px);
box-shadow:
0 0 20px rgba(56,189,248,0.5),
0 0 40px rgba(56,189,248,0.2);
}

.card h4{
color:#38bdf8;
margin-bottom:10px;
}

.card h1{
font-size:40px;
color:#22c55e;
text-shadow:0 0 10px #22c55e;
}

/* CHART */

.chart{
background:#0f172a;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px rgba(56,189,248,0.3);
}

/* TABLE */

.tableBox{
grid-column:1/3;
background:#0f172a;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px rgba(56,189,248,0.3);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #1e293b;
text-align:center;
}

th{
color:#38bdf8;
}

tr:hover{
background:#020617;
}

/* OMZ PANEL */

.omz{
background:#0f172a;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px rgba(255,0,0,0.3);
margin-top:20px;
}

.omz h3{
color:#f87171;
}

/* STATUS COLORS */

.normal{
color:#22c55e;
}

.warning{
color:#facc15;
}

.danger{
color:#ef4444;
}

</style>

</head>


<body>

<header>
🌊 Ocean Oxygen Monitor (Research Dashboard)
</header>

<div class="container">

<!-- OXYGEN CARD -->

<div>

<div class="card">

<h4>Latest Oxygen Value</h4>

<h1 id="oxygen"></h1>

<p>µmol/kg</p>

<p id="status"></p>

</div>


<!-- OMZ DETECTOR -->

<div class="omz">

<h3>⚠ Oxygen Minimum Zone Detector</h3>

<p id="omzStatus"></p>

<p id="depthStatus"></p>

</div>

</div>



<!-- CHART -->

<div class="chart">

<h3>Oxygen vs Depth Profile</h3>

<canvas id="chart"></canvas>

</div>



<!-- TABLE -->

<div class="tableBox">

<h3>Ocean Oxygen Profile Data</h3>

<table>

<thead>

<tr>
<th>Depth (m)</th>
<th>Oxygen (µmol/kg)</th>
</tr>

</thead>

<tbody id="tableData"></tbody>

</table>

</div>

</div>


<script>

/* HARDCODED OCEAN DATA */

const depth=[0,200,500,1000,1500,2000,2500,3000];

const oxygen=[260,210,170,140,110,85,70,60];


/* UPDATE CARD */

let latest=oxygen[oxygen.length-1];

document.getElementById("oxygen").innerText=latest;

if(latest>120){

document.getElementById("status").innerHTML=
"<span class='normal'>High Oxygen Zone</span>";

}

else if(latest>80){

document.getElementById("status").innerHTML=
"<span class='warning'>Moderate Oxygen</span>";

}

else{

document.getElementById("status").innerHTML=
"<span class='danger'>Low Oxygen Zone</span>";

}


/* OMZ DETECTOR */

if(latest<80){

document.getElementById("omzStatus").innerHTML=
"<span class='danger'>Oxygen Minimum Zone Detected</span>";

}

else{

document.getElementById("omzStatus").innerHTML=
"<span class='normal'>No OMZ Detected</span>";

}

document.getElementById("depthStatus").innerText=
"Monitoring depth: 3000 m";


/* CREATE TABLE */

let html="";

for(let i=0;i<depth.length;i++){

html+=`
<tr>
<td>${depth[i]}</td>
<td>${oxygen[i]}</td>
</tr>
`;

}

document.getElementById("tableData").innerHTML=html;


/* CHART */

const ctx=document.getElementById("chart");

new Chart(ctx,{

type:"line",

data:{

labels:depth,

datasets:[{

label:"Oxygen µmol/kg",

data:oxygen,

borderColor:"#22c55e",

backgroundColor:"rgba(34,197,94,0.2)",

fill:true,

tension:0.4

}]

},

options:{

plugins:{
legend:{labels:{color:"white"}}
},

scales:{
x:{ticks:{color:"white"}},
y:{ticks:{color:"white"}}
}

}

});

</script>

</body>
</html>
