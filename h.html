
<!DOCTYPE html>
<html>
<head>

<title>Real-Time Ocean Acoustic Monitoring</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
}

header{
padding:20px;
text-align:center;
font-size:28px;
background:linear-gradient(90deg,#0f172a,#1e3a8a);
box-shadow:0 0 20px #38bdf8;
}

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
padding:30px;
}

.card{
background:#0f172a;
border-radius:12px;
padding:20px;
box-shadow:0 0 15px rgba(56,189,248,0.4);
}

.acoustic{
position:relative;
height:420px;
background:#020617;
border-radius:10px;
overflow:hidden;
}

.source{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:30px;
}

.wave{
position:absolute;
border:2px dashed rgba(255,120,120,0.7);
border-radius:50%;
animation:pulse 4s infinite;
}

@keyframes pulse{

0%{
width:40px;
height:40px;
left:calc(50% - 20px);
top:calc(50% - 20px);
opacity:1;
}

100%{
width:350px;
height:350px;
left:calc(50% - 175px);
top:calc(50% - 175px);
opacity:0;
}

}

.status{
margin-top:10px;
color:#38bdf8;
}

</style>

</head>

<body>

<header>
🌊 Real-Time Ocean Acoustic Monitoring
</header>

<div class="container">

<div class="card">

<h3>Sound Speed vs Depth</h3>

<canvas id="chart"></canvas>

<div class="status" id="status">
Loading real-time ocean data...
</div>

</div>

<div class="card">

<h3>Acoustic Propagation</h3>

<div class="acoustic">

<div class="source">📡</div>
<div class="wave"></div>

</div>

</div>

</div>

<script>

/* SOUND SPEED FORMULA */

function soundSpeed(T,S,D){

return 1449.2
+4.6*T
-0.055*T*T
+0.00029*T*T*T
+(1.34-0.01*T)*(S-35)
+0.016*D;

}


/* FETCH REAL TIME SEA TEMPERATURE */

async function loadOceanData(){

try{

const res = await fetch(
"https://marine-api.open-meteo.com/v1/marine?latitude=15&longitude=72&hourly=sea_surface_temperature"
);

const data = await res.json();

const temp = data.hourly.sea_surface_temperature[0];

document.getElementById("status").innerHTML =
"Live Sea Surface Temp: " + temp + " °C";

generateProfile(temp);

}

catch(e){

document.getElementById("status").innerHTML =
"Real-time data unavailable – using fallback ocean profile";

generateProfile(27);

}

}


/* GENERATE DEPTH PROFILE */

function generateProfile(surfaceTemp){

const depth=[0,50,100,200,300,500,700,1000];

let tempProfile=[];
let salinityProfile=[];
let speed=[];

for(let i=0;i<depth.length;i++){

let t = surfaceTemp - (depth[i]*0.02);

if(t<2) t=2;

tempProfile.push(t);

salinityProfile.push(34.5 + (depth[i]*0.0005));

speed.push(soundSpeed(t,salinityProfile[i],depth[i]));

}

drawChart(depth,speed);

}


/* DRAW CHART */

function drawChart(depth,speed){

new Chart(document.getElementById("chart"),{

type:"line",

data:{

labels:depth,

datasets:[{

label:"Sound Speed (m/s)",

data:speed,

borderColor:"#22d3ee",

backgroundColor:"rgba(34,211,238,0.2)",

fill:true,

tension:0.4

}]

},

options:{

plugins:{
legend:{labels:{color:"white"}}
},

scales:{

x:{
title:{display:true,text:"Depth (m)",color:"white"},
ticks:{color:"white"}
},

y:{
title:{display:true,text:"Sound Speed (m/s)",color:"white"},
ticks:{color:"white"}
}

}

}

});

}


/* START */

loadOceanData();

</script>

</body>

</html>
